name: Settle results

# Every 4 hours: fill in final scores for logged fixtures that have finished.
on:
  schedule:
    - cron: "20 */4 * * *"
  workflow_dispatch:

concurrency:
  group: settle
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: python -m mbtgrandaudit settle
