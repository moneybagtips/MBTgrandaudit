name: Settle results

# Every 4 hours: fill in final scores for logged fixtures that have finished.
on:
  schedule:
    - cron: "20 */4 * * *"
  workflow_dispatch:

concurrency:
  group: settle
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: python -m mbtgrandaudit settle

  # settle the saved Flexibet slips (slips/*.json) once their games have results
  slips:
    needs: settle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Settle slips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for f in slips/*.json; do
            stem="${f%.json}"
            [ -e "$stem.settled" ] && continue
            python -m mbtgrandaudit slips settle "$f" --md "$stem.results.md" --done-flag "$stem.settled" > /dev/null
            if [ -e "$stem.settled" ]; then
              n=$(gh issue list --state all --search "in:title \"Slips: $(basename "$stem")\"" --json number --jq '.[0].number')
              [ -n "$n" ] && gh issue comment "$n" --body-file "$stem.results.md" && gh issue close "$n" --reason completed
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A slips
          git diff --cached --quiet || { git commit -m "Settle slips"; git pull --rebase --quiet && git push; }
