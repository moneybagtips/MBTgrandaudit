name: Set up MBTgrandaudit
description: Python, dependencies (pip-cached) and a quick database connectivity check
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements.txt
    - shell: bash
      run: pip install -r requirements.txt
    - shell: bash
      run: |
        if [ -z "$DATABASE_URL" ]; then
          echo "::error::DATABASE_URL secret is not set (Settings > Secrets and variables > Actions)"
          exit 1
        fi
        python -m mbtgrandaudit db
